name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operational problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Explain new scopes, third parties or sensitive data involved.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Operational value
      options:
        - Nice to have
        - Saves agent time
        - Prevents data loss
        - Security or compliance
    validations:
      required: true
