      <text x="90" y="29" text-anchor="middle" fill="#12385f">Leads &amp; bookings</text>
      <rect x="194" width="190" height="46" rx="23" fill="#fff" opacity=".13"/>
      <text x="289" y="29" text-anchor="middle" fill="#fff">Installment payments</text>
      <rect x="398" width="150" height="46" rx="23" fill="#fff" opacity=".13"/>
      <text x="473" y="29" text-anchor="middle" fill="#fff">Audit trail</text>
    </g>
  </g>
  <g transform="translate(760 76)" filter="url(#shadow)">
    <rect width="360" height="270" rx="22" fill="#fff"/>
    <rect x="24" y="24" width="125" height="14" rx="7" fill="#153b66"/>
    <rect x="24" y="56" width="312" height="58" rx="14" fill="#f1f5fa"/>
    <rect x="42" y="74" width="86" height="10" rx="5" fill="#8094aa"/>
