<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Open Travel CRM</title>
  <desc id="desc">Open-source travel agency CRM built with Google Sheets and Apps Script</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092846"/>
      <stop offset="1" stop-color="#1f6096"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".2"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="58" r="190" fill="#ffffff" opacity=".045"/>
  <circle cx="1130" cy="370" r="250" fill="#ef8b22" opacity=".08"/>
  <g transform="translate(70 70)">
    <rect width="64" height="64" rx="18" fill="#ef8b22"/>
    <text x="32" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="800" fill="#fff">OT</text>
    <text x="0" y="132" font-family="Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">Open Travel CRM</text>
    <text x="0" y="178" font-family="Arial,sans-serif" font-size="24" fill="#c7dcf0">Google Sheets + Apps Script · secure by design</text>
    <g transform="translate(0 230)" font-family="Arial,sans-serif" font-size="16" font-weight="700">
