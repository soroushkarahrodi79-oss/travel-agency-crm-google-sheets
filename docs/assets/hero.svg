      <text x="122" y="28" font-family="Arial" font-size="10" fill="#63748a">PAID</text>
      <text x="122" y="64" font-family="Arial" font-size="23" font-weight="700" fill="#15805d">€8.4k</text>
      <text x="230" y="28" font-family="Arial" font-size="10" fill="#63748a">BALANCE</text>
      <text x="230" y="64" font-family="Arial" font-size="23" font-weight="700" fill="#ef8b22">€2.1k</text>
